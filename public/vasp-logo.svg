<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <defs>
    <linearGradient id="v-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2A88"/>
      <stop offset="100%" stop-color="#1A4AD8"/>
    </linearGradient>
    <linearGradient id="v-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>
  <!-- Logo Mark: Shield with V -->
  <rect x="8" y="16" width="80" height="128" rx="12" fill="url(#v-grad)"/>
  <rect x="8" y="16" width="80" height="128" rx="12" fill="none" stroke="#1A4AD8" stroke-width="1" opacity="0.3"/>
  <!-- Rail track lines inside shield -->
  <line x1="20" y1="136" x2="76" y2="136" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <line x1="20" y1="140" x2="76" y2="140" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- V letterform -->
  <polyline points="24,104 48,48 72,104" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small triangle accent -->
  <polygon points="42,60 48,48 54,60" fill="url(#v-accent)"/>
  <!-- Company Name -->
  <text x="110" y="72" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#0A2A88" letter-spacing="-1">VASP</text>
  <text x="110" y="106" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#5B6778" letter-spacing="5.5">SYSTEMIC</text>
  <!-- Orange accent line -->
  <line x1="110" y1="120" x2="110" y2="128" stroke="#F97316" stroke-width="3" stroke-linecap="round"/>
  <line x1="118" y1="122" x2="210" y2="122" stroke="#E5E7EB" stroke-width="1"/>
  <!-- Tagline -->
  <text x="110" y="142" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#9CA3AF" letter-spacing="3.5">RAILWAY IoT SOLUTIONS</text>
</svg>
